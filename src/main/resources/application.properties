spring.application.name=jiburo-server

# ==========================================
# Internationalization (i18n) 설정 (기존 내용)
# ==========================================
spring.messages.encoding=UTF-8
spring.messages.always-use-message-format=true
spring.messages.fallback-to-system-locale=false

# ==========================================
# Server & Log 설정
# ==========================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 우리 프로젝트 로그는 DEBUG 레벨로 자세히 보기
logging.level.com.jiburo=DEBUG
#logging.level.org.springframework.web.socket=DEBUG
#logging.level.org.springframework.messaging=DEBUG

# ==========================================
# CORS
# ==========================================
# 허용 origin (콤마 구분, 와일드카드 패턴 지원). 운영은 CORS_ALLOWED_ORIGINS 환경변수로 주입
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://jiburo.on-do.kro.kr,http://localhost:3000}

# application-{이름}.properties 파일을 자동으로 찾아서 합쳐줍니다.
spring.profiles.include=oauth, jwt, db, r2

# hashids 설정
app.hashids.salt="jiburo-secret-salt-do-not-share!"
app.hashids.min-length=16
