# ─── DB: H2 인메모리로 대체 ───────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ─── Redis: 테스트에서 비활성화 (auto-config 제외는 @SpringBootTest에서) ─
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ─── JWT ─────────────────────────────────────────────────────────
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1vbmx5LW1pbi0yNTYtYml0cy1sb25nISE=
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ─── OAuth2 (더미값) ──────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-client-secret
spring.security.oauth2.client.registration.naver.client-id=test-naver-client-id
spring.security.oauth2.client.registration.naver.client-secret=test-naver-client-secret

# ─── Cloudflare R2 (더미값) ──────────────────────────────────────
cloud.cloudflare.r2.credentials.access-key=test-access-key
cloud.cloudflare.r2.credentials.secret-key=test-secret-key
cloud.cloudflare.r2.endpoint=https://test.r2.cloudflarestorage.com
cloud.cloudflare.r2.bucket=test-bucket
cloud.cloudflare.r2.public-url=https://test.public.r2.dev

# ─── Hashids ─────────────────────────────────────────────────────
app.hashids.salt=test-salt
app.hashids.min-length=8
